version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: golu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-golu_khaja_ghar}
      MYSQL_USER: ${MYSQL_USER:-golu_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-golu_pass_123}
    ports:
      # Expose for local development access; restrict in production environments
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - golu_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: golu_services
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-golu_user}:${MYSQL_PASSWORD:-golu_pass_123}@mysql:3306/${MYSQL_DATABASE:-golu_khaja_ghar}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    networks:
      - golu_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: golu_web
    restart: unless-stopped
    depends_on:
      - services
    ports:
      - "80:80"
    networks:
      - golu_network

volumes:
  mysql_data:

networks:
  golu_network:
    driver: bridge
